<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{TITLE}} — Relatório de Verificação</title>
<style>
  :root {
    --bg: #0d1117; --surface: #161b22; --border: #30363d;
    --text: #e6edf3; --text-muted: #8b949e;
    --green: #3fb950; --yellow: #d29922; --red: #f85149; --blue: #58a6ff;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: var(--bg); color: var(--text); padding: 2rem; max-width: 960px; margin: 0 auto; }
  h1 { font-size: 1.5rem; margin-bottom: 0.25rem; }
  .meta { color: var(--text-muted); font-size: 0.85rem; margin-bottom: 1.5rem; }
  .meta span { margin-right: 1.5rem; }

  .summary { display: flex; gap: 1rem; margin-bottom: 2rem; flex-wrap: wrap; }
  .stat { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 1rem 1.25rem; min-width: 100px; text-align: center; }
  .stat .value { font-size: 1.75rem; font-weight: 700; }
  .stat .label { font-size: 0.75rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em; }
  .stat.pass .value { color: var(--green); }
  .stat.fail .value { color: var(--red); }
  .stat.skip .value { color: var(--yellow); }

  .badge { display: inline-block; padding: 0.25rem 0.75rem; border-radius: 999px; font-weight: 600; font-size: 0.85rem; }
  .badge.good { background: rgba(63,185,80,0.15); color: var(--green); }
  .badge.warn { background: rgba(210,153,34,0.15); color: var(--yellow); }
  .badge.bad { background: rgba(248,81,73,0.15); color: var(--red); }

  h2 { font-size: 1.15rem; margin: 1.5rem 0 0.75rem; padding-bottom: 0.5rem; border-bottom: 1px solid var(--border); }
  details { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; margin-bottom: 0.5rem; }
  summary { padding: 0.75rem 1rem; cursor: pointer; font-weight: 500; display: flex; align-items: center; gap: 0.5rem; }
  summary::-webkit-details-marker { display: none; }
  summary::before { content: '▶'; font-size: 0.7rem; transition: transform 0.2s; }
  details[open] summary::before { transform: rotate(90deg); }
  .card-body { padding: 0 1rem 1rem; }
  .card-body p { margin: 0.25rem 0; font-size: 0.9rem; }
  .card-body img { max-width: 100%; border-radius: 4px; margin-top: 0.5rem; border: 1px solid var(--border); }

  .indicator { width: 10px; height: 10px; border-radius: 50%; display: inline-block; flex-shrink: 0; }
  .indicator.pass { background: var(--green); }
  .indicator.fail { background: var(--red); }
  .indicator.skip { background: var(--yellow); }

  .expected { color: var(--green); }
  .actual { color: var(--red); }
  .evidence { color: var(--text-muted); font-family: monospace; font-size: 0.85rem; }

  footer { margin-top: 3rem; padding-top: 1rem; border-top: 1px solid var(--border); color: var(--text-muted); font-size: 0.8rem; text-align: center; }
</style>
</head>
<body>

<h1>{{TITLE}}</h1>
<div class="meta">
  <span>📅 {{DATE}}</span>
  <span>🔗 {{URL}}</span>
  <span>🌿 {{BRANCH}}</span>
</div>

<div class="summary">
  <div class="stat"><div class="value">{{TOTAL}}</div><div class="label">Total</div></div>
  <div class="stat pass"><div class="value">{{PASS_COUNT}}</div><div class="label">Passed</div></div>
  <div class="stat fail"><div class="value">{{FAIL_COUNT}}</div><div class="label">Failed</div></div>
  <div class="stat skip"><div class="value">{{SKIP_COUNT}}</div><div class="label">Skipped</div></div>
  <div class="stat"><div class="value"><span class="badge {{RATE_CLASS}}">{{PASS_RATE}}%</span></div><div class="label">Pass Rate</div></div>
</div>

{{FAILURES_SECTION}}

{{PASSES_SECTION}}

{{SKIPS_SECTION}}

<footer>
  Gerado por product-verification · Claude Code · {{DATE}}
</footer>

</body>
</html>
